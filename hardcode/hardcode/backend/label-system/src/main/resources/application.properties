spring.application.name=alto-shaam-master-label-system

# ---------------------------------------------------------------- Server
server.port=${PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.mime-types=application/json
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=4096
server.tomcat.connection-timeout=20s
server.tomcat.max-swallow-size=2MB
server.max-http-request-header-size=16KB
spring.mvc.async.request-timeout=120s
   

# ------------------------------------------------------------ PostgreSQL
# Override with environment variables in every real deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/label_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Connection pool (HikariCP): fail fast instead of hanging when the DB is busy.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.leak-detection-threshold=60000
# Abort lock waits after 15s and statements after 60s so one stuck query cannot freeze the app.
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=15000 -c statement_timeout=60000

# ------------------------------------------------------- JPA / Hibernate
# "update" keeps the existing behaviour. For production prefer "validate" with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.transaction.default-timeout=60s

# --------------------------------------------------------------- Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------ Monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ----------------------------------------------------------- Application
label.storage-dir=${LABEL_STORAGE_DIR:./data/generated}
label.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://192.168.1.150:5173}
label.app-name=Alto-Shaam Master Label System
# Protection against overload / huge requests
label.max-rows=${LABEL_MAX_ROWS:500}
label.max-physical-labels=${LABEL_MAX_PHYSICAL:5000}
# How many PDFs may be rendered at the same time (extra requests wait, then get HTTP 503)
label.pdf.max-concurrent=${PDF_MAX_CONCURRENT:4}
label.pdf.acquire-timeout-seconds=${PDF_ACQUIRE_TIMEOUT:30}
